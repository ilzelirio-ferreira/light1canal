name: Build ESP-Matter

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test input filter and portal validation
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror light/tests/ac_input_test.cpp -o /tmp/ac_input_test
          /tmp/ac_input_test
          g++ -std=c++17 -Wall -Wextra -Werror light/tests/web_helpers_test.cpp -o /tmp/web_helpers_test
          /tmp/web_helpers_test
          node light/tests/portal_ui_test.js

      - name: Pull ESP-Matter Docker image
        run: docker pull espressif/esp-matter:latest

      - name: Build
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            -e IDF_PATH=/opt/espressif/esp-idf \
            -e IDF_TOOLS_PATH=/opt/espressif/tools \
            -e ESP_MATTER_PATH=/opt/espressif/esp-matter \
            -e NINJA_JOBS=4 \
            espressif/esp-matter:latest \
            bash -c "cd /project/light && python3 tools/fix_chip_usb_cdc.py && python3 tools/fix_idf_usb_cdc.py && idf.py set-target esp32s2 && idf.py build"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: light-firmware
          path: |
            light/build/light.bin
            light/build/light.elf
            light/build/light.map
            light/build/bootloader/bootloader.bin
            light/build/partition_table/partition-table.bin
            light/build/ota_data_initial.bin
            light/build/flasher_args.json
            light/build/flash_args
          if-no-files-found: error
